# Tag a release to publish it:  git tag v1.4.0 && git push origin v1.4.0
# 1. Checks the tag matches the app version, type-checks and builds.
# 2. Publishes the self-hosted image to GitHub's registry: ghcr.io/<owner>/inuberry:<version> (e.g. 1.4.0) and :latest.
#    The image holds the built app only (no source). Make the package public in GitHub › Packages
#    when self-hosters should be able to pull it without signing in.
# 3. Creates the GitHub release. Self-hosted installs learn about it from the release feed
#    (https://crm.inuberry.com/api/public/releases) once the hosted app runs the new version.
name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the app version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -q "\"version\": \"$TAG\"" package.json || { echo "package.json version is not $TAG"; exit 1; }
          grep -q "APP_VERSION = \"$TAG\"" src/lib/version.ts || { echo "src/lib/version.ts is not $TAG"; exit 1; }
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile && bunx tsc --noEmit
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        run: |
          echo "IMAGE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/inuberry" >> "$GITHUB_ENV"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.version=${{ env.VERSION }}
      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
